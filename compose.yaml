services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pcm}
      POSTGRES_USER: ${POSTGRES_USER:-pcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcm-lokal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcm} -d ${POSTGRES_DB:-pcm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Nilai di bawah menimpa .env agar host database selalu "db"
      DATABASE_URL: postgres://${POSTGRES_USER:-pcm}:${POSTGRES_PASSWORD:-pcm-lokal}@db:5432/${POSTGRES_DB:-pcm}
      SECRET_KEY: ${SECRET_KEY:-kunci-khusus-docker-lokal-bukan-rahasia}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:$${PORT:-8000} --workers 2"

volumes:
  pgdata:
  media:
