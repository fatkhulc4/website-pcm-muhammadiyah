
{% load static %}

<header class="navbar">
    <div class="container nav-content">

        <a href="{% url 'core:home' %}" class="brand">
            <img src="{% static 'core/img/logo-muhammadiyah3.png' %}"
                 alt="Logo Muhammadiyah" class="brand-logo">
            <span class="brand-text">
                <strong>{{ site_profile.short_name|default:"PCM Masaran" }}</strong>
                {% if site_profile.tagline %}
                    <small>{{ site_profile.tagline }}</small>
                {% endif %}
            </span>
        </a>

        <button type="button" class="nav-toggle" id="nav-toggle"
                aria-label="Buka menu" aria-expanded="false" aria-controls="main-nav">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="main-nav">

            <a href="{% url 'core:home' %}"
                class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                Beranda
            </a>

            <a href="{% url 'core:profil' %}"
               class="{% if request.resolver_match.url_name == 'profil' %}active{% endif %}">
                Profil
            </a>

            <a href="{% url 'core:pimpinan' %}"
               class="{% if request.resolver_match.url_name == 'pimpinan' %}active{% endif %}">
                Pimpinan
            </a>

            <a href="{% url 'core:ranting' %}"
               class="{% if request.resolver_match.url_name == 'ranting' %}active{% endif %}">
                Ranting
            </a>

            <a href="{% url 'core:amal_usaha' %}"
               class="{% if request.resolver_match.url_name == 'amal_usaha' %}active{% endif %}">
                Amal Usaha
            </a>

            <a href="{% url 'core:berita' %}"
               class="{% if request.resolver_match.url_name == 'berita' %}active{% endif %}">
                Berita
            </a>

            <a href="{% url 'core:agenda' %}"
               class="{% if request.resolver_match.url_name == 'agenda' %}active{% endif %}">
                Agenda
            </a>

            <a href="{% url 'core:unduhan' %}"
               class="{% if request.resolver_match.url_name == 'unduhan' %}active{% endif %}">
                Unduhan
            </a>

            <a href="{% url 'core:kontak' %}"
               class="{% if request.resolver_match.url_name == 'kontak' %}active{% endif %}">
                Kontak
            </a>

        </nav>

    </div>
</header>

<script>
    (function () {
        var btn = document.getElementById('nav-toggle');
        var nav = document.getElementById('main-nav');

        btn.addEventListener('click', function () {
            var open = nav.classList.toggle('is-open');
            btn.classList.toggle('is-open', open);
            btn.setAttribute('aria-expanded', open);
        });
    })();
</script>
